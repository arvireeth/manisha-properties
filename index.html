
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/images/Logo.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Manisha" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Manisha Properties | Buy, Sell & Rent Properties in Delhi NCR
    </title>

    <meta
      name="description"
      content="Manisha Properties Advisors & Consultants is a trusted DLF Authorized Channel Partner offering property buying, selling, rentals, investment guidance, and property management services across Delhi NCR."
    />

    <meta
      name="keywords"
      content="Manisha Properties, DLF Channel Partner, Delhi NCR Property, Buy Property Delhi, Sell Property Delhi, Rent Property Delhi, Property Consultant, Real Estate Advisor, Property Management, Moti Nagar Property, DLF Capital Greens"
    />

    <meta name="author" content="Manisha Properties" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://manishaproperties.in/" />

    <!-- Theme -->
    <meta name="theme-color" content="#D4AF37" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Manisha Properties | Buy, Sell & Rent Properties"
    />

    <meta
      property="og:description"
      content="Trusted Real Estate Advisors & Consultants. Sale, Purchase, Rental, Property Management & Investment Guidance across Delhi NCR."
    />

    <meta
      property="og:image"
      content="https://manishaproperties.in/images/Logo.jpg"
    />

    <meta
      property="og:url"
      content="https://manishaproperties.in"
    />

    <meta property="og:site_name" content="Manisha Properties" />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Manisha Properties"
    />

    <meta
      name="twitter:description"
      content="Trusted Property Advisors & Consultants in Delhi NCR."
    />

    <meta
      name="twitter:image"
      content="https://manishaproperties.in/images/Logo.jpg"
    />

    <!-- Prioritize the responsive hero image before the React app hydrates. -->
    <link
      rel="preload"
      as="image"
      href="/images/Manisha_Properties_visiting_card-640.webp"
      imagesrcset="/images/Manisha_Properties_visiting_card-400.webp 400w, /images/Manisha_Properties_visiting_card-640.webp 640w"
      imagesizes="(max-width: 640px) calc(100vw - 32px), 366px"
      fetchpriority="high"
    />

    <!-- Preload the Latin font files used in the first viewport to reduce font-swap layout shifts. -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2" crossorigin />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
